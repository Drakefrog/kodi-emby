name: Upstream check
on:
  schedule: [{cron: '17 4 * * 1'}]
  workflow_dispatch: {}
permissions: {contents: write, pull-requests: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - id: check
        run: python3 tools/check_upstreams.py || test $? -eq 10
      - name: Create review-only sync PR
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          if grep -q '→' UPSTREAM_SYNC_REPORT.md; then
            branch="automation/upstream-$(date +%Y%m%d)"
            git checkout -b "$branch"
            git add UPSTREAM_SYNC_REPORT.md
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot] commit -m 'chore: report upstream updates'
            git push origin "$branch"
            gh pr create --base main --head "$branch" --title 'chore: review upstream updates' --body-file UPSTREAM_SYNC_REPORT.md || true
          fi
